<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trading et al. — a complete, self-paced course on the basics of trading Contracts for Difference, in English and Arabic. Manuals, calculators and risk management. Education, not financial advice.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="./logo/favicon-32.svg" sizes="32x32" type="image/svg+xml">
    <link rel="icon" href="./logo/favicon-16.svg" sizes="16x16" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./logo/mark.svg">
    <meta name="theme-color" content="#0A0F1C">
    <!-- Applies a stored light-mode choice before the first paint. Without it
         a reader who chose light sees the dark default flash while the app
         boots. Mirrors read() in src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('cfd-course:theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Linked here rather than @import-ed from index.css: an @import cannot be
         discovered until the stylesheet has downloaded, so the faces arrived a
         round trip late and the first paint was in the fallbacks. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
    <title>Trading et al.</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
