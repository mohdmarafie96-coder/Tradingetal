<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 72" width="208" height="72" role="img" aria-label="Module badge states: not started, in progress, complete">
  <!-- not started -->
  <rect x="4" y="4" width="48" height="48" rx="12" fill="none" stroke="#C3CEDF" stroke-width="1.5"/>
  <text x="28" y="35" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="19" font-weight="600" fill="#33445C">01</text>
  <text x="28" y="66" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="9" fill="#4B5B72">not started</text>

  <!-- in progress -->
  <rect x="80" y="4" width="48" height="48" rx="12" fill="#4D8DFF"/>
  <text x="104" y="35" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="19" font-weight="600" fill="#0A0F1C">02</text>
  <text x="104" y="66" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="9" fill="#4B5B72">in progress</text>

  <!-- complete -->
  <rect x="156" y="4" width="48" height="48" rx="12" fill="#E8EFFD"/>
