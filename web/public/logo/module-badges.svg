<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 72" width="208" height="72" role="img" aria-label="Module badge states: not started, in progress, complete">
  <!-- not started -->
  <rect x="4" y="4" width="48" height="48" rx="12" fill="none" stroke="rgba(20,32,30,0.22)" stroke-width="1.5"/>
  <text x="28" y="35" text-anchor="middle" font-family="'Newsreader',Georgia,serif" font-size="19" font-weight="600" fill="#5B5145">01</text>
  <text x="28" y="66" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="9" fill="#7A6F60">not started</text>

  <!-- in progress -->
  <rect x="80" y="4" width="48" height="48" rx="12" fill="#17130E"/>
  <text x="104" y="35" text-anchor="middle" font-family="'Newsreader',Georgia,serif" font-size="19" font-weight="600" fill="#FBF8F1">02</text>
  <text x="104" y="66" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="9" fill="#7A6F60">in progress</text>

  <!-- complete -->
  <rect x="156" y="4" width="48" height="48" rx="12" fill="#EAE4D8"/>
